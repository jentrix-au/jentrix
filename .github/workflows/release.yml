name: release

# Publishes the three client packages — `@jentrix/plugin-claude`,
# `@jentrix/plugin-codex` and `@jentrix/cli` — when a `cli-v*` tag is pushed,
# PACK-ONCE and STRAIGHT TO `latest`: `pnpm -r pack` runs exactly once, the
# three tarballs are clean-installed and exercised TOGETHER, and the very same
# files are then `npm publish`ed under the `latest` dist-tag — plugins first,
# the CLI last, because the CLI's package.json pins the plugin versions and must
# never be installable before they are. Nothing repacks between validation and
# upload.
#
# CANDIDATE-FIRST WAS REMOVED 2026-09-06, and it is worth knowing why rather
# than restoring it. Promotion ran `npm dist-tag add`, which is not a publish,
# so trusted publishing's OIDC token could not authorize it and the job needed
# an account credential. npm is now RESTRICTING tokens that bypass 2FA for
# direct publishing and account changes (https://gh.io/npm-gat-bypass2fa-deprecation),
# so that job failed `EOTP` on every one of its four attempts with a correctly
# scoped granular token — it never once succeeded, and every `latest` this
# repository has set was set by hand. A soak period nobody could leave is worse
# than no soak period: it made "released" mean "published somewhere users are
# not looking" and hid the manual step. Publishing is exempt because OIDC is not
# a token, which is why the publish half has always worked.
#
# WHAT THIS COSTS. A bad release is what everyone installs, immediately. There
# is no `next` to catch it, and rolling back means `npm dist-tag add
# @jentrix/cli@<previous> latest` from a browser-authenticated session
# (`npm login`) — the same manual path promotion needed, and it moves the tag
# rather than unpublishing, because nothing is ever unpublished. The
# clean-install exercise in the pack/validate steps below is now the ONLY gate
# between a tarball and every user; keep it exhaustive.
# Publishing is deliberately tag-triggered, never on merge — see
# docs/releasing.md.
#
# Auth is npm TRUSTED PUBLISHING (OIDC): no npm credential exists anywhere in
# this repository or its secrets. The registry authorizes each publish by
# validating a short-lived OIDC token minted by GitHub for this exact
# repository + workflow file + ENVIRONMENT, which is why `id-token: write` and
# `environment: release` below are both load-bearing, and why renaming this
# file or the environment breaks publishing until the trusted publisher is
# re-pointed on npmjs.com. EACH of the three packages needs its own
# trusted-publisher entry there (organization or user `jentrix-au`, repository
# `jentrix`, workflow `release.yml`, environment `release`, allowed action: npm
# publish). The `release` environment carries a required reviewer, so EVERY
# run of the publish job — a tag or a manual dry run —
# waits in the Actions UI for that approval before a single step executes.
#
# A MANUAL run (workflow_dispatch) is a DRY RUN and can never
# publish. It exists because npm performs the OIDC exchange before any of its
# dry-run branches, so `npm publish --dry-run` proves whether trusted publishing
# is actually configured — without consuming a version number. Run it after
# any change to the npm-side publisher config, this file's name, the
# environment, or the npm major.
#
# Green means trusted publishing is configured for every package. The dry run
# reaches npm's "cannot publish over the previously published versions" check
# — which runs AFTER auth, so arriving there is the pass — and the publish
# steps translate exactly that one case into success. The line behind the
# verdict is:
#     npm http fetch POST 201 …/oidc/token/exchange/package/<pkg>
#     npm verbose oidc Successfully retrieved and set token
# A 404 on that POST means no trusted publisher is registered for that package
# against THIS repository + workflow + environment, and the run goes red like
# anything else that is actually broken (.github/scripts/publish-package.sh
# requires the exchange line on a dry run — npm alone would exit 0 for a
# package it could not authenticate, having proven nothing).
#
# The optional Homebrew bump still needs `HOMEBREW_TAP_TOKEN`; it is unset and
# the tap does not exist, so that job is a clean skip on every release.

on:
  push:
    tags:
      - "cli-v*"
  # A manual run is a DRY RUN of the publish path and publishes nothing — it
  # exists to prove the trusted publishers still authorize this repository
  # before a version number is spent. There is no promote input any more.
  workflow_dispatch:

jobs:
  publish:
    name: Pack once, validate, publish to `latest`
    # Every run reaches here: a tag publishes, a manual run is a dry run
    # (`DRY` is derived from IS_TAG inside publish-package.sh).
    runs-on: ubuntu-latest
    # The protected environment: its required reviewer gates every run of this
    # job, and its name is part of what npm's trusted publisher validates.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # mint the OIDC token npm exchanges for publish rights
    env:
      IS_TAG: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive and verify CLI version
        id: ver
        if: github.ref_type == 'tag'
        # The tag pins the CLI: package.json and CLI_VERSION must equal it, and
        # each plugin package must agree with its provider manifest.
        run: |
          ver="${GITHUB_REF_NAME#cli-v}"
          node scripts/check-version.mjs "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      # PACK ONCE. `prepack` builds dist/ inside the CLI package; pnpm rewrites
      # every `workspace:*` range to the exact version. These three files are
      # what gets validated AND what gets published — nothing repacks after
      # this step, and any `workspace:` range that survived is a red build.
      - name: Pack the three packages once
        id: pack
        run: |
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out"
          pnpm -r pack --pack-destination "$out"
          ls -la "$out"
          pick() { ls "$out"/"$1"-*.tgz | head -n1; }
          claude="$(pick jentrix-plugin-claude)"; codex="$(pick jentrix-plugin-codex)"; cli="$(pick jentrix-cli)"
          for t in "$claude" "$codex" "$cli"; do
            test -s "$t" || { echo "::error::missing tarball: $t"; exit 1; }
            if tar -xzOf "$t" package/package.json | grep -q "workspace:"; then
              echo "::error::$t still carries a workspace: range — pnpm did not rewrite it"
              exit 1
            fi
            echo "$t: $(tar -xzOf "$t" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log(p.name+"@"+p.version)})')"
          done
          echo "claude=$claude" >> "$GITHUB_OUTPUT"
          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"

      # CLEAN-INSTALL AND TEST THE EXACT TARBALLS, together, in an empty
      # project: the installed bin runs, the generated tree renders, the plugin
      # packages resolve from the CLI's dependency tree (`--dry-run` stages
      # them without a provider binary), and the CLI package carries no
      # plugins/ of its own. This is the same proof test/pack-smoke.test.ts
      # makes, on the files that will be uploaded rather than a fresh pack.
      - name: Clean-install and exercise the exact tarballs
        env:
          CLAUDE_TGZ: ${{ steps.pack.outputs.claude }}
          CODEX_TGZ: ${{ steps.pack.outputs.codex }}
          CLI_TGZ: ${{ steps.pack.outputs.cli }}
        run: |
          proj="$RUNNER_TEMP/consumer"
          mkdir -p "$proj" && cd "$proj"
          echo '{"name":"consumer","private":true}' > package.json
          npm install --no-audit --no-fund "$CLAUDE_TGZ" "$CODEX_TGZ" "$CLI_TGZ"
          bin="$proj/node_modules/.bin/jentrix"
          "$bin" --version | tee /dev/stderr | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+ \(surface: [0-9]+ tools' || { echo "::error::--version lacks the surface count"; exit 1; }
          "$bin" --help | grep -q ' task ' || { echo "::error::generated command tree missing from --help"; exit 1; }
          test ! -d node_modules/@jentrix/cli/plugins || { echo "::error::the CLI tarball still carries plugins/"; exit 1; }
          for p in claude codex; do
            PATH="$(dirname "$(command -v node)")" "$bin" plugin install "$p" --dry-run | tee /dev/stderr | grep -q "node_modules/@jentrix/plugin-$p" || { echo "::error::$p plugin did not resolve from the installed tree"; exit 1; }
          done

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles 10.9.x. Only the
      # publish client moves — the gates above deliberately keep running on the
      # Node this project has always tested against. The `^` ceiling is
      # deliberate too: npm 12 changes install-time script defaults, which is not
      # something to discover for the first time inside a release job.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # No NODE_AUTH_TOKEN: npm exchanges the job's OIDC token for publish
      # rights (POST /-/npm/v1/oidc/token/exchange/package/<name>).
      #
      # `--loglevel verbose` is LOAD-BEARING, not debug noise. npm's OIDC helper
      # is written to never throw — every failure path (no id_token, exchange
      # rejected, no token in the response) is a `log.verbose('oidc', …)` and a
      # silent `return undefined`. Publishing then continues with whatever
      # `_authToken` is configured, which under actions/setup-node is the
      # literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`, and the registry answers
      # an unauthenticated PUT for an existing package with a bare
      # `E404 Not Found` — it will not admit the package exists. So a refused
      # trusted publisher looks identical to a typo'd package name unless the
      # reason is asked for. Verbose keeps the reason in the log. It prints no
      # secret: the id_token is only ever sent as a header, and success logs
      # the words, never the token.
      #
      # The salvage branch in publish-package.sh exists so a PASSING
      # verification run reports green: the tree normally holds the version
      # already on npm, so a dry run reaches npm's version check and dies there
      # — AFTER the exchange it was run to test. DRY is derived in the SHELL,
      # never by an Actions ternary (`a && b || c` returns an OPERAND, not a
      # boolean — a release once published nothing while every step reported
      # success). `npm publish <tarball>` runs no prepack: the bytes uploaded
      # are the bytes validated above.
      - name: Publish @jentrix/plugin-claude to `latest`
        id: plugin_claude
        continue-on-error: true
        env:
          TARBALL: ${{ steps.pack.outputs.claude }}
        run: .github/scripts/publish-package.sh "$TARBALL" plugin

      - name: Publish @jentrix/plugin-codex to `latest`
        id: plugin_codex
        continue-on-error: true
        env:
          TARBALL: ${{ steps.pack.outputs.codex }}
        run: .github/scripts/publish-package.sh "$TARBALL" plugin

      # The CLI goes LAST, and on a tag only after both plugins: its package.json
      # pins their versions. A dry run continues regardless so the CLI's own
      # OIDC exchange is observed even while a plugin has no publisher yet.
      - name: Publish @jentrix/cli to `latest`
        id: cli
        if: github.ref_type != 'tag' || (steps.plugin_claude.outcome == 'success' && steps.plugin_codex.outcome == 'success')
        env:
          TARBALL: ${{ steps.pack.outputs.cli }}
        run: .github/scripts/publish-package.sh "$TARBALL" cli

      # The verdict on the plugin steps, AFTER the CLI step ran: a red plugin
      # publish is still a red run (continue-on-error only defers it).
      - name: Verdict on the plugin publishes
        if: steps.plugin_claude.outcome != 'success' || steps.plugin_codex.outcome != 'success'
        run: |
          echo "::error::plugin publish failed — plugin-claude: ${{ steps.plugin_claude.outcome }}, plugin-codex: ${{ steps.plugin_codex.outcome }}. A 'POST 404 … package not found' at the OIDC exchange means the package has no trusted publisher registered against jentrix-au/jentrix + release.yml + environment release (docs/releasing.md)."
          exit 1

      # Green must be a claim about the REGISTRY, not about an exit code. The
      # publish steps above exit 0 on a dry run by design, so without this the
      # only difference between "released" and "released nothing" is a line in
      # a log nobody reads. Ask npm — for all three, at their own versions.
      - name: Prove the release is on npm
        if: github.ref_type == 'tag'
        env:
          CLI_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Registry reads lag a just-finished publish by MINUTES now that npm
          # answers `PUT 202 … Your package is being processed and may take a
          # few minutes to become available` and finishes the publish
          # asynchronously. Poll for up to ten minutes, and when it still is
          # not there, say what is actually known — the publish step already
          # printed `+ <pkg>@<version>` or it did not — instead of a verdict
          # this step cannot reach.
          check() {
            pkg="$1"; want="$2"; ok=""
            for attempt in $(seq 1 30); do
              if [ "$(npm view "$pkg@$want" version 2>/dev/null)" = "$want" ]; then
                ok=1; break
              fi
              echo "$pkg@$want not visible yet (attempt $attempt/30) — retrying in 20s"
              sleep 20
            done
            if [ -z "$ok" ]; then
              echo "::error::$pkg@$want is not visible on the registry after 10 minutes. If the publish step above printed '+ $pkg@$want' (npm 202 — still processing), wait and check 'npm view $pkg@$want version' before doing ANYTHING — never republish or re-run; if it did not, nothing was published."
              exit 1
            fi
            echo "$pkg@$want confirmed on npm (dist-tags: $(npm view "$pkg" dist-tags --json 2>/dev/null | tr -d '\n '))"
          }
          check @jentrix/plugin-claude "$(node -p 'require("./plugins/claude/package.json").version')"
          check @jentrix/plugin-codex "$(node -p 'require("./plugins/codex/package.json").version')"
          check @jentrix/cli "$CLI_VERSION"

      - name: Create GitHub Release
        # Tag runs only: a dry run publishes nothing, so it has nothing to
        # announce (and `steps.ver` never ran to give it a version).
        if: github.ref_type == 'tag'
        # VERSION is mapped into env (not interpolated into the script body) per
        # workflow-injection hygiene; it is already a strict semver validated by
        # the guard step above, and the tag comes from $GITHUB_REF_NAME (a
        # runner-provided env var), never templated into the shell.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Jentrix CLI v${VERSION}" \
            --notes "\`@jentrix/cli@${VERSION}\` and the plugin packages it pins are on npm under \`latest\`. Install: \`npm i -g @jentrix/cli\`."

  bump-homebrew:
    name: Bump Homebrew tap
    needs: publish
    # Tag runs only: a dry run publishes no tarball for a formula to point at.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Gate on HOMEBREW_TAP_TOKEN
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "No HOMEBREW_TAP_TOKEN secret — skipping automatic formula bump (do it manually per docs/releasing.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Render formula from the published tarball and push to the tap
        if: steps.gate.outputs.run == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#cli-v}"
          # npm's CDN can lag a few seconds behind publish; retry the fetch.
          for i in 1 2 3 4 5; do
            if node scripts/render-homebrew-formula.mjs "$ver" > /tmp/jentrix.rb; then break; fi
            echo "tarball not visible yet (attempt $i) — waiting…"; sleep 10
          done
          test -s /tmp/jentrix.rb || { echo "::error::could not render formula"; exit 1; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/jentrix-au/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp /tmp/jentrix.rb tap/Formula/jentrix.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/jentrix.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "jentrix ${ver}"
            git push
          fi
